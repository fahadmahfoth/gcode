# cargo-deny policy (ADR 0009). Run by scripts/ci.sh as `cargo deny check all`.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# ADR 0009 allowlist: MIT, Apache-2.0, BSD, ISC, Unicode.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # memchr is "Unlicense OR MIT"; MIT is accepted, so this is not relied on.
    "Unlicense",
    # Beyond the ADR text. Both are already in the tree and need a maintainer
    # decision recorded in an ADR amendment: option-ext (via dirs-sys) is
    # file-level copyleft, webpki-roots (via ureq, `download` feature only) is a
    # data licence.
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
