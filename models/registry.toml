# The model registry — the single source of truth for what gcode will download.
#
# Embedded into the binary with include_str! (ADR 0010). There is no search path
# and no environment variable pointing here: the registry is the binary, so a
# user cannot end up with a registry newer than the tool that trusts it.
#
# Adding a model is a diff to this file. Nothing else in the repository has to
# change, and `git log models/registry.toml` is the complete history of every
# model gcode has ever been willing to download.
#
# ---------------------------------------------------------------------------
# The `verified` field is a promise to the user and a release gate.
# ---------------------------------------------------------------------------
#
# `verified = true` means the maintainer downloaded this exact file, hashed it,
# and confirmed the digest matches `sha256`. It is the act ADR 0010 requires.
# `build.rs` refuses a *release* build while any entry is `verified = false`, so
# a model whose checksum only came from a web page cannot ship by accident.
# Debug builds and the test suite are unaffected, so `cargo test` and a local
# run work before the download.
#
# URLs are pinned to a Hugging Face commit, not a branch, so the bytes behind a
# URL cannot change. The `sha256` values are the content hashes Hugging Face
# publishes in its git-LFS pointers for that commit. All three entries were
# downloaded with `gcode --download-model` on 2026-10-03, and `sha256sum` and the
# byte length of each file were checked independently of the tool.
#
# The fields:
#
#   name                  what the user types after --use-model; kebab-case
#   description           one line for --list-models
#   url                   direct HTTPS download URL, commit-pinned
#   sha256                lowercase hex, 64 characters, required
#   size_bytes            shown before the download so it can be declined
#   default               exactly one entry may set this
#   context_size          native window, 512..=32768
#   recommended_threads   a hint, never applied automatically
#   license               SPDX identifier
#   verified              true once the maintainer has hashed the file itself

[[model]]
name        = "qwen3-0.6b"
description = "Default. Small, fast, and multilingual (Arabic + English)."
url         = "https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/50968a4468ef4233ed78cd7c3de230dd1d61a56b/Qwen3-0.6B-Q4_K_M.gguf"
sha256      = "ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a"
size_bytes  = 396705472
default     = true
context_size = 32768
recommended_threads = 4
license     = "Apache-2.0"
verified    = true

